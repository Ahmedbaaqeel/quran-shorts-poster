name: Daily post

# Runs on GitHub's servers, so the owner's PC can be off.
# 12:17, 13:23 and 14:41 UTC = 15:17, 16:23 and 17:41 in Riyadh, before the 18:00
# post time in config.json. Later runs only retry what an earlier one missed.
# Off the hour on purpose: GitHub drops scheduled runs at busy times, and on
# 2026-11-23 both on-the-hour runs (13:00, 14:00) never started.
on:
  schedule:
    - cron: "17 12 * * *"
    - cron: "23 13 * * *"
    - cron: "41 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing to Buffer)"
        type: boolean
        default: false
      post_now:
        description: "Post the next unposted video right away (about 10 minutes), for testing"
        type: boolean
        default: false
      fill_missing:
        description: "Post the latest posted video to platforms it is missing (e.g. new Instagram), in about 10 minutes"
        type: boolean
        default: false
      test_date:
        description: "Dry runs only: pretend today is this date (YYYY-MM-DD)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Put this week's videos on the Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          POST_NOW: ${{ inputs.post_now && '1' || '' }}
          FILL_MISSING: ${{ inputs.fill_missing && '1' || '' }}
          TODAY: ${{ inputs.dry_run && inputs.test_date || '' }}
        run: python post.py stage --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Show Buffer's post format (dry runs only, read-only)
        if: ${{ inputs.dry_run }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python post.py schema

      - name: Queue today's posts in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          POST_NOW: ${{ inputs.post_now && '1' || '' }}
          FILL_MISSING: ${{ inputs.fill_missing && '1' || '' }}
          TODAY: ${{ inputs.dry_run && inputs.test_date || '' }}
        run: python post.py queue

      - name: Save the posting log
        if: always()
        run: |
          python post.py status
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "quran-shorts poster"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted.json
            git commit -m "Posting log $(date -u +%F)"
            git push
          fi
